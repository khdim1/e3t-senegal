<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Groupe E3T Sénégal — Menuiserie aluminium, construction & décoration</title>
<meta name="author" content="Xelkoom Valey">
<meta name="description" content="Architecture, immobilier, construction, décoration et menuiserie aluminium à Dakar.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap">
<style>
:root{
  --bg:#fff; --bg2:#f2f6fa; --tx:#14202e; --mut:#56657a;
  --card:#fff; --ln:#dde5ee; --bl:#1d5aa6; --navy:#0c2749; --or:#f47b20;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b1522; --bg2:#101d2e; --tx:#eef3f8; --mut:#a3b3c6;
    --card:#13233a; --ln:rgba(255,255,255,.12);
  }
}
:root[data-theme="dark"]{
  --bg:#0b1522; --bg2:#101d2e; --tx:#eef3f8; --mut:#a3b3c6;
  --card:#13233a; --ln:rgba(255,255,255,.12);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{
  margin:0;
  font-family:"Poppins",system-ui,sans-serif;
  background:var(--bg);
  color:var(--tx);
  line-height:1.65;
  min-height:100vh;
}
h1,h2{font-family:"Playfair Display",Georgia,serif;line-height:1.12;margin:.2em 0}
h3{margin:.2em 0}

/* =====================================================

   .i1{background:url("fond-e3t.jpg") center/cover no-repeat;}
   ===================================================== */
.i1{

  height:100%;
  background-color:#0c2749;

'560' width='100' height='160'/><rect x='1100' y='500' width='90' height='180'/><rect x='1220' y='560' width='80' height='120'/><rect x='1580' y='580' width='90' height='140'/></g><g fill='%23f47b20' opacity='0.85'><circle cx='1760' cy='160' r='6'/><circle cx='1720' cy='220' r='3.5'/><circle cx='1800' cy='240' r='4.5'/></g></svg>");
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
}
/* Voile léger pour améliorer le contraste si vous ajoutez du contenu plus tard */
.i1::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg, rgba(12,39,73,0.15) 0%, rgba(12,39,73,0.35) 100%);
  pointer-events:none;
}

/* Contenu de démonstration minimal pour vérifier que tout se superpose bien */
.hero{
  position:relative;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:32px;
  color:#fff;
  text-align:center;
}
.hero h1{
  font-size:clamp(2rem,6vw,4rem);
  text-shadow:0 2px 24px rgba(0,0,0,.45);
  margin:0 0 .3em;
}
.hero p{
  font-size:clamp(1rem,2vw,1.25rem);
  max-width:640px;
  opacity:.95;
  text-shadow:0 1px 12px rgba(0,0,0,.5);
}
</style>
</head>
<body>

  <!-- Image uniquement en arrière-plan -->
  <div class="i1" role="img" aria-label="Arrière-plan décoratif Groupe E3T"></div>

  <!-- Contenu visible (remplacez / supprimez selon votre besoin) -->
  <main class="hero">
    <div>
      <h1>Groupe E3T Sénégal</h1>
      <p>Menuiserie aluminium · Construction · Décoration</p>
    </div>
  </main>

</body>
</html>
