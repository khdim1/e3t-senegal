<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Groupe E3T Sénégal — Menuiserie aluminium, construction & décoration</title>
<meta name="author" content="Xelkoom Valey">
<meta name="description" content="Architecture, immobilier, construction, décoration et menuiserie aluminium à Dakar.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap">
<style>
:root{
  --bg:#fff; --bg2:#f2f6fa; --tx:#14202e; --mut:#56657a;
  --card:#fff; --ln:#dde5ee; --bl:#1d5aa6; --navy:#0c2749; --or:#f47b20;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b1522; --bg2:#101d2e; --tx:#eef3f8; --mut:#a3b3c6;
    --card:#13233a; --ln:rgba(255,255,255,.12);
  }
}
:root[data-theme="dark"]{
  --bg:#0b1522; --bg2:#101d2e; --tx:#eef3f8; --mut:#a3b3c6;
  --card:#13233a; --ln:rgba(255,255,255,.12);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{
  margin:0;
  font-family:"Poppins",system-ui,sans-serif;
  background:var(--bg);
  color:var(--tx);
  line-height:1.65;
}
h1,h2{font-family:"Playfair Display",Georgia,serif;line-height:1.12;margin:.2em 0}
h3{margin:.2em 0}

/* ============================================================
   ARRIÈRE-PLAN UNIQUEMENT — visuel décoratif plein écran
   Pour utiliser votre propre photo, remplacez le bloc .i1 par :
   .i1{position:fixed;inset:0;z-index:-1;
       background:url("fond-e3t.jpg") center/cover no-repeat;}
   ============================================================ */
.i1{
  position:fixed;
  inset:0;
  z-index:-1;
  background-color:var(--navy);
  background-image:
    radial-gradient(circle at 18% 25%, rgba(244,123,32,.28) 0%, transparent 45%),
    radial-gradient(circle at 82% 72%, rgba(29,90,166,.40) 0%, transparent 52%),
    linear-gradient(135deg, #0c2749 0%, #1d5aa6 55%, #f47b20 100%);
  background-repeat:no-repeat;
  background-size:cover;
}
.i1::after{
  content:"";
  position:absolute;
  inset:0;
  background-image:repeating-linear-gradient(
    45deg,
    rgba(255,255,255,.03) 0px,
    rgba(255,255,255,.03) 2px,
    transparent 2px,
    transparent 22px
  );
  pointer-events:none;
}
</style>
</head>
<body>
  <!-- Image / visuel uniquement en arrière-plan -->
  <div class="i1" role="img" aria-label="Arrière-plan décoratif Groupe E3T"></div>
</body>
</html>
